services:
  app:
    build: .
    env_file: .env
    environment:
      - DB_HOST=db
    volumes:
      - generated_images:/app/generated_images
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # ADR: entrypoint overrides the Dockerfile ENTRYPOINT (streamlit). docker-compose
  # `command:` only overrides CMD; since the Dockerfile uses ENTRYPOINT the api service
  # must use `entrypoint:` to replace the startup command with uvicorn. Ticket: SOC-23.
  api:
    build: .
    env_file: .env
    environment:
      - DB_HOST=db
    entrypoint: ["uvicorn", "src.api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - generated_images:/app/generated_images
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-social_media_gen}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-social_media_gen}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
      - api
    restart: unless-stopped

volumes:
  pgdata:
  generated_images:
