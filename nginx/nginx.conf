upstream streamlit {
    server app:8501;
}

upstream fastapi {
    server api:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10M;

    # ADR: proxy_pass trailing slash strips the /api/ prefix before forwarding to
    # FastAPI. FastAPI routes are /health, /providers, /generate (no /api prefix).
    # Using `proxy_pass http://fastapi/;` causes nginx to rewrite /api/health →
    # /health at the upstream. A rewrite rule would also work but is more verbose.
    # Ticket: SOC-23.
    location /api/ {
        proxy_pass http://fastapi/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://streamlit;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Streamlit WebSocket support
    location /_stcore/stream {
        proxy_pass http://streamlit/_stcore/stream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }
}
